name: OpenCode Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.name "opencode-bot"
          git config --global user.email "opencode-bot@users.noreply.github.com"

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # use_github_token: true works around anomalyco/opencode#37823
          # (immutable OIDC sub breaks the app-token exchange on repos created after 2026-07-15)
          use_github_token: true
          model: opencode/nemotron-3-ultra-free
          share: false
          prompt: |
            Review this pull request for bugs, security flaws, regressions,
            and violations of this repository's documented security invariants.
